services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: palladium-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Persist Caddy data (certificates, etc.)
      - caddy_data:/data
      - caddy_config:/config
      # Expose ckpool logs read-only directly under /pool-data
      # POOL_LOG_DIR is required: compose fails fast if unset/empty
      - ${POOL_LOG_DIR:?POOL_LOG_DIR is required}:/srv/pool-data:ro
    environment:
      - CADDY_HOST=${CADDY_HOST}
      - API_KEY=${API_KEY}
      - API_PORT=${API_PORT:-8080}
    networks:
      - palladium
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    # If running behind a firewall/NAT, ensure port 443 is reachable from the Internet

  # Replaces the old palladium-stack dashboard: serves /api/* (see api/server.py).
  # Container name must stay "palladium-dashboard": Caddy proxies to it by that name.
  api:
    build: ./api
    container_name: palladium-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"  # dev only: browser calls it directly
    environment:
      - RPC_URL=${RPC_URL:-http://docker-palladiumcore:2332}
      - RPC_USER=${RPC_USER}
      - RPC_PASSWORD=${RPC_PASSWORD}
      - FULCRUM_HOST=${FULCRUM_HOST:-plm-fulcrum}
      - FULCRUM_PUBLIC_HOST=${FULCRUM_PUBLIC_HOST:-}
      - API_KEY=${API_KEY}
    networks:
      - palladium

volumes:
  caddy_data:
  caddy_config:

networks:
  palladium:
    name: palladium 
